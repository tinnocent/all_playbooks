        recurse: yes
        age_stamp: mtime
      register: aberdeen_720p_files
      ignore_errors: yes

    - name: Remove old AberdeenSD HD 720P MPG files
      win_file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ aberdeen_720p_files.files | default([]) }}"
      when: aberdeen_720p_files is succeeded
      ignore_errors: yes

    - name: Clean Webspots AberdeenSD HD 1080i - MPG files (4 days)
