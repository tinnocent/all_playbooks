---
# Ansible Playbook for Media Storage Cleanup
# Converts batch script to Ansible for Windows hosts

- name: Clean up media storage directories
  hosts: servers
  vars:
    storage_base: "\\\\mnt.250isistor1.aetnglobal.corp\\AltComDelStorage"
    ansible_user: "aetnglobal\\250UsrCommDel"
    ansible_password: "250De1ivery!23"
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985
    
  tasks:
    # --- Webspots / AberdeenSD ---
    - name: Clean Webspots AberdeenSD - MPG files (4 days)
      win_find:
        paths: "{{ storage_base }}\\Webspots\\AberdeenSD"
        patterns: "*.mpg"
        age: 4d
        recurse: yes
        age_stamp: mtime
      register: aberdeen_base_files
      ignore_errors: yes

    - name: Remove old AberdeenSD base MPG files
      win_file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ aberdeen_base_files.files | default([]) }}"
      when: aberdeen_base_files is succeeded
      ignore_errors: yes

    - name: Clean Webspots AberdeenSD HD 720P - MPG files (4 days)
      win_find:
        paths: "{{ storage_base }}\\Webspots\\AberdeenSD\\HD 720P"
